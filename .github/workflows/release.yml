# Builds Laser Studio for macOS (universal: Apple silicon + Intel),
# Windows and Linux. On a pull request it only checks that everything
# builds; on a `v*` tag it also publishes the three downloads as a GitHub
# Release, under fixed names so the download page can always link to
# `releases/latest/download/<name>`.
name: Release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # The release version compiled into a tagged build (update.rs): only
  # those builds update themselves. Empty on a pull request.
  LASER_STUDIO_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: sed -i.bak "1,/^version = /s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" studio/Cargo.toml && rm studio/Cargo.toml.bak && grep -m1 '^version' studio/Cargo.toml
      - name: Rust (Apple silicon + Intel)
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Laser Studio.app (Apple silicon)
        run: studio/packaging/macos/build_app.sh "$PWD/out"
      - name: Intel binary, merged into a universal app
        run: |
          cargo build --release -p laser-studio --features macos-app --target x86_64-apple-darwin
          BIN="out/Laser Studio.app/Contents/MacOS/laser-studio"
          lipo -create "$BIN" target/x86_64-apple-darwin/release/laser-studio -output "$BIN.universal"
          mv "$BIN.universal" "$BIN"
          lipo -info "$BIN"
          codesign --force --sign - "out/Laser Studio.app"
      - name: Zip
        run: cd out && ditto -c -k --keepParent "Laser Studio.app" ../LaserStudio-macOS.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: LaserStudio-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: sed -i.bak "1,/^version = /s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" studio/Cargo.toml && rm studio/Cargo.toml.bak && grep -m1 '^version' studio/Cargo.toml
      - name: Build
        run: cargo build --release -p laser-studio
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "Laser Studio" | Out-Null
          Copy-Item target/release/laser-studio.exe "Laser Studio/Laser Studio.exe"
          Compress-Archive -Path "Laser Studio" -DestinationPath LaserStudio-Windows.zip
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $version = if ($env:GITHUB_REF_NAME -like "v*") { $env:GITHUB_REF_NAME.Substring(1) } else { "0.0.0" }
          & $iscc "/DAppVersion=$version" studio\packaging\windows\laser-studio.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item out\LaserStudio-Windows-Setup.exe .
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            LaserStudio-Windows.zip
            LaserStudio-Windows-Setup.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: sed -i.bak "1,/^version = /s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" studio/Cargo.toml && rm studio/Cargo.toml.bak && grep -m1 '^version' studio/Cargo.toml
      - name: System libraries (audio, MIDI, USB)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev
      - name: Build
        run: cargo build --release -p laser-studio
      - name: Archive
        run: |
          mkdir laser-studio
          cp target/release/laser-studio laser-studio/
          tar czf LaserStudio-Linux.tar.gz laser-studio
      - name: AppImage
        run: |
          P=studio/packaging/linux
          mkdir -p AppDir/usr/bin
          cp target/release/laser-studio AppDir/usr/bin/
          cp $P/AppRun $P/laser-studio.desktop $P/laser-studio.png AppDir/
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool AppDir LaserStudio-Linux.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            LaserStudio-Linux.tar.gz
            LaserStudio-Linux.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Laser Studio $GITHUB_REF_NAME" --notes "Téléchargements : https://mimi6060.github.io/ilda-laser/" \
            LaserStudio-macOS.zip LaserStudio-Windows-Setup.exe LaserStudio-Windows.zip \
            LaserStudio-Linux.AppImage LaserStudio-Linux.tar.gz
