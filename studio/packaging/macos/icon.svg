<?xml version="1.0" encoding="UTF-8"?>
<!-- Laser Studio application icon (T-413). Drawn for this project: a beam
     fan leaving a projector aperture over a dark stage. Converted to
     AppIcon.icns by build_app.sh; the .icns is never committed. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#3dff9a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#18e0ff" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#3dff9a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3dff9a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#stage)"/>
  <g clip-path="url(#tile)" stroke="url(#beam)" stroke-linecap="round" fill="none">
    <!-- Seven beams from the aperture, wider apart towards the edges. -->
    <line x1="512" y1="780" x2="130" y2="250" stroke-width="14"/>
    <line x1="512" y1="780" x2="270" y2="170" stroke-width="16"/>
    <line x1="512" y1="780" x2="400" y2="140" stroke-width="18"/>
    <line x1="512" y1="780" x2="512" y2="130" stroke-width="22"/>
    <line x1="512" y1="780" x2="624" y2="140" stroke-width="18"/>
    <line x1="512" y1="780" x2="754" y2="170" stroke-width="16"/>
    <line x1="512" y1="780" x2="894" y2="250" stroke-width="14"/>
  </g>
  <!-- The projector: a rounded box with its aperture glowing. -->
  <rect x="402" y="780" width="220" height="90" rx="28" fill="#2a2f45" stroke="#4b5578" stroke-width="6"/>
  <circle cx="512" cy="780" r="70" fill="url(#glow)"/>
  <circle cx="512" cy="780" r="20" fill="#ffffff"/>
</svg>
