<p>Une liste de cues est une suite de pas joués un par un avec « GO », comme au théâtre.</p>
<ul>
<li>« + Liste » crée une liste ; « Ajouter le cue en cours » ou « + Ajouter un pas » la remplit.</li>
<li>« GO » passe au pas suivant, « Retour » revient, « Pause » fige, « Début » repart du premier pas.</li>
</ul>
