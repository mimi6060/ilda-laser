<p>Une scène garde le look courant pour le rejouer d'un clic.</p>
<ul>
<li>Donnez un nom et une durée, puis « Sauver ». ▶ rejoue la scène.</li>
<li>« ▶ Playlist » enchaîne les scènes dans l'ordre, chacune pendant sa durée ; « ■ Stop » arrête.</li>
<li>Pour supprimer une scène, maintenez ✕ (pas de clic accidentel).</li>
</ul>
