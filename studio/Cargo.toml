[package]
name = "laser-studio"
version = "0.1.0"
edition = "2021"
description = "Live laser show studio for the Mac: shapes, text, animation and music-reactive effects, with a browser UI and live preview."

[dependencies]
laser-dac = { version = "0.13.1", default-features = false, features = ["ether-dream", "idn", "helios", "lasercube-network", "lasercube-usb"] }  # LaserCube (T-496): laser-dac's own MIT code, no libLaserdockCore
libusb1-sys = { version = "0.7", features = ["vendored"] }  # Helios USB (T-303): libusb built from source and linked in, never a Homebrew dylib
# tiny_http 0.12.0 with our robustness patches (T-449, MIT OR Apache-2.0):
# bounded drain of an unread body, bounded header lines and count,
# per-connection timeouts, no stop on an accept error. Each change is
# marked "Laser Studio patch" in `vendor/tiny_http`.
tiny_http = { path = "vendor/tiny_http", default-features = false }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a float read back is the one written (the standby
# mirror compares beats and times exactly; T-511).
serde_json = { version = "1", features = ["float_roundtrip"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"  # MIT OR Apache-2.0: statvfs for the free disk space (T-450); already in the tree
log = "0.4"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }  # local time with offset for the safety log (already pulled in by env_logger)
env_logger = "0.11"
ctrlc = { version = "3", features = ["termination"] }  # SIGINT + SIGTERM
midir = "0.11"
cpal = "0.18.2"
rtrb = "0.4.0"
realfft = "3.5.0"
hound = "3.5.1"
claxon = "0.4.3"
nanomp3 = "0.1.1"
roxmltree = "0.21"
ponk-protocol = "0.1"  # MIT, zero dependencies: PONK wire format (T-300)
if-addrs = "0.15"  # MIT OR BSD-3-Clause: list this Mac's interfaces for the DMX input (T-406); already in the tree via laser-dac
socket2 = "0.5"  # MIT OR Apache-2.0: SO_REUSEADDR + multicast join for sACN (T-406); already in the tree
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }  # MIT: the `.lspack` package (T-289), deflate only (flate2 already in the tree)
sha2 = "0.10"  # MIT OR Apache-2.0 (RustCrypto): media fingerprints in the `.lspack` manifest (T-289), approved script lists (T-458)
# Scripts (T-458): the interpreter is our own code (src/script/lang.rs, same
# licence as the studio); no scripting crate is pulled in.
# GPL-2.0-or-later (wraps Ableton's official Link library, GPLv2+): ONLY
# behind the `ableton-link` feature below, never in a default build (T-154).
rusty_link = { version = "0.4.9", optional = true }

[features]
# Native ShowNET output foundation (T-471), off by default. Without the
# Laserworld SDK binding (private, never in the repository: see
# `src/shownet.rs`) it only adds the code and its tests with a fake box.
shownet = []
# *Son du Mac* (T-241), off by default: capture what the Mac plays through
# a Core Audio process tap (public Apple API, macOS 14.6+), using the
# loopback stream `cpal` already has. No extra dependency; it needs the
# operator's "Enregistrement audio du système" permission. Without it the
# studio offers the BlackHole route (help page `son-du-mac`).
system-audio = []
# Ableton Link tempo source (T-154), off by default. It compiles
# Ableton's Link library, which is GPLv2+: a binary built with it is a
# GPL combined work, for private use only and never distributed (the
# default build has no GPL code: `cargo tree -p laser-studio`). It can't
# be combined with `shownet` (a proprietary SDK under NDA). Building it
# needs CMake and Xcode's libclang.
ableton-link = ["dep:rusty_link"]
# The menu-bar item of the macOS application (T-413), off by default so
# `cargo build`, `cargo test` and the e2e runs pull in no GUI code. Built
# by `studio/packaging/macos/build_app.sh`. objc2 family: MIT.
macos-app = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:block2"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSString", "NSTimer", "NSDate", "NSGeometry", "NSObject", "block2", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSResponder", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSMenu", "NSMenuItem", "NSImage", "NSBezierPath", "NSColor", "NSGraphics", "block2", "objc2-core-foundation"] }
block2 = { version = "0.6", optional = true }
