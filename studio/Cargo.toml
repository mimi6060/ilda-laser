[package]
name = "laser-studio"
version = "0.1.0"
edition = "2021"
description = "Live laser show studio for the Mac: shapes, text, animation and music-reactive effects, with a browser UI and live preview."

[dependencies]
laser-dac = { version = "0.13.1", default-features = false, features = ["ether-dream", "idn"] }
tiny_http = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
ctrlc = "3"
