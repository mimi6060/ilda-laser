# tiny_http 0.12.0 as published on crates.io (MIT OR Apache-2.0), with the
# Laser Studio robustness patches of T-449 (each marked "Laser Studio
# patch" in the sources). The SSL dependencies and the test-only ones are
# left out: Laser Studio serves plain HTTP on 127.0.0.1 (and the tablet
# remote on the LAN) and never builds the `ssl-*` features.

[package]
edition = "2018"
name = "tiny_http"
version = "0.12.0"
authors = [
    "pierre.krieger1708@gmail.com",
    "Corey Farwell <coreyf@rwell.org>",
]
description = "Low level HTTP server library"
documentation = "https://tiny-http.github.io/tiny-http/tiny_http/index.html"
readme = "README.md"
keywords = [
    "http",
    "server",
    "web",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tiny-http/tiny-http"

[dependencies.ascii]
version = "1.0"

[dependencies.chunked_transfer]
version = "1"

[dependencies.httpdate]
version = "1.0.2"

[dependencies.log]
version = "0.4.4"

# Declared so the sources' `cfg(feature = "ssl-…")` stay known; never
# enabled (their dependencies are not in this copy).
[features]
default = []
ssl = []
ssl-openssl = []
ssl-rustls = []
