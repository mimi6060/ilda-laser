[package]
name = "ilda-laser"
version = "0.1.0"
edition = "2021"
description = "Control an ILDA/Ether Dream laser projector over the network, or a DMX fixture over Art-Net."

[dependencies]
laser-dac = { version = "0.13.1", default-features = false, features = ["ether-dream"] }
ilda = "0.2.0"
artnet_protocol = "0.4.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ctrlc = "3"
env_logger = "0.11"
